const catLabel = { tech:'技術基礎', stable:'ステーブルコイン', jplaw:'日本制度', intl:'国際比較・規制', cbdc:'CBDC', risk:'失敗事例', mp:'金融政策' };
const rankLabel = { S:'S — 必読', A:'A — 重要', B:'B — 補強', C:'C — 限定的' };
const rankOrder = { S:0, A:1, B:2, C:3 };

let catFilter = 'all';
let rankFilter = 'all';

function setFilter(val, type, el) {
  if (type === 'cat') { catFilter = val; document.querySelectorAll('.controls:first-child .filter-btn').forEach(b=>b.classList.remove('active')); }
  else { rankFilter = val; document.querySelectorAll('.controls:nth-child(2) .filter-btn').forEach(b=>b.classList.remove('active')); }
  el.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = refs.filter(r => {
    const mc = catFilter === 'all' || r.cat === catFilter;
    const mr = rankFilter === 'all' || r.rank === rankFilter;
    const mq = !q || [r.title, r.author, r.desc, r.year, r.type].some(s => s.toLowerCase().includes(q));
    return mc && mr && mq;
  }).sort((a,b) => rankOrder[a.rank] - rankOrder[b.rank]);
  document.getElementById('count').textContent = `${filtered.length} 件`;
  document.getElementById('list').innerHTML = filtered.map(r => `
    <div class="card">
      <div class="card-header">
        <span class="rank-tag r${r.rank.toLowerCase()}">${rankLabel[r.rank]}</span>
        <span class="cat-tag ct-${r.cat}">${catLabel[r.cat]}</span>
        <span class="card-title">${r.title}</span>
        <span class="type-badge">${r.type}</span>
      </div>
      <div class="card-meta">${r.author} (${r.year})</div>
      <div class="card-desc">${r.desc}</div>
      <div class="card-rank-reason">${r.rankReason}</div>
      <div class="card-link"><a href="${r.url}" target="_blank">${r.url}</a></div>
    </div>
  `).join('') || '<div class="empty">該当する文献がありません</div>';
}

render();
</script>
